services:
  postgres:
    image: postgres:16
    container_name: odontocloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odontocloud_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: odontocloudmppm26
    ports:
      - "5432:5432"
    volumes:
      - odontocloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odontocloud_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odontocloud-postgres-data:
